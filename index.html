<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Финансовый Ассистент</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            margin: 0; padding: 16px;
        }
        .container { max-width: 400px; margin: 0 auto; }
        h2 { text-align: center; color: #2481cc; margin-bottom: 10px; }
        
        /* Вкладки (Табы) */
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab-btn {
            flex: 1; padding: 10px; border: none; border-radius: 8px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000); cursor: pointer; font-weight: bold;
        }
        .tab-btn.active { background-color: #2481cc; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 16px; border-radius: 12px; margin-bottom: 16px;
        }
        label { display: block; margin: 10px 0 5px; font-weight: bold; font-size: 14px; }
        input {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px;
            box-sizing: border-box; background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        button {
            width: 100%; background-color: #2481cc; color: white; border: none;
            padding: 12px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 15px;
        }
        .btn-secondary { background-color: #4caf50; margin-top: 5px; }
        .result {
            margin-top: 15px; padding: 12px; background: #e1f5fe;
            color: #0288d1; border-radius: 8px; font-size: 14px; line-height: 1.4; display: none;
        }
        .debt-item {
            font-size: 13px; background: var(--tg-theme-bg-color, #fff);
            padding: 6px 10px; border-radius: 6px; margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 Фин-Приложение</h2>

    <!-- Кнопки переключения -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-compound')">📈 Процент</button>
        <button class="tab-btn" onclick="switchTab('tab-debts')">📉 Долги</button>
    </div>

    <!-- ВКЛАДКА 1: Сложный процент -->
    <div id="tab-compound" class="tab-content active">
        <div class="card">
            <label>Начальная сумма (руб):</label>
            <input type="number" id="principal" value="50000">
            <label>Ежемесячный взнос (руб):</label>
            <input type="number" id="monthly" value="5000">
            <label>Годовой процент (%):</label>
            <input type="number" id="rate" value="16">
            <label>Срок (лет):</label>
            <input type="number" id="years" value="5">
            <button onclick="calcCompound()">Рассчитать капитал</button>
            <div id="compoundResult" class="result"></div>
        </div>
    </div>

    <!-- ВКЛАДКА 2: Снежный ком -->
    <div id="tab-debts" class="tab-content">
        <div class="card">
            <div id="debtForm">
                <label>Название долга:</label>
                <input type="text" id="debtName" placeholder="Например: Кредитка">
                <label>Остаток долга (руб):</label>
                <input type="number" id="debtBalance" placeholder="30000">
                <label>Минимальный платёж (руб):</label>
                <input type="number" id="debtMin" placeholder="2000">
                <button class="btn-secondary" onclick="addDebt()">➕ Добавить долг</button>
            </div>

            <div id="addedDebtsBlock" style="margin-top: 15px; display: none;">
                <strong>Добавленные долги:</strong>
                <div id="debtsList"></div>
            </div>

            <label style="margin-top: 20px;">Ежемесячный ускоритель (руб):</label>
            <input type="number" id="debtExtra" value="0">
            
            <button onclick="calcSnowball()">🚗 Запустить Снежный ком</button>
            <div id="snowballResult" class="result"></div>
        </div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();

    let globalDebts = [];

    // Переключение вкладок
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // Расчет сложного процента
    function calcCompound() {
        const p = parseFloat(document.getElementById('principal').value) || 0;
        const m = parseFloat(document.getElementById('monthly').value) || 0;
        const r = (parseFloat(document.getElementById('rate').value) || 0) / 100 / 12;
        const months = (parseInt(document.getElementById('years').value) || 0) * 12;

        let total = p;
        let invested = p;
        for (let i = 0; i < months; i++) {
            total = total * (1 + r) + m;
            invested += m;
        }

        const resDiv = document.getElementById('compoundResult');
        resDiv.style.display = 'block';
        resDiv.innerHTML = `🏆 <b>Итоговый капитал:</b> ${total.toLocaleString('ru-RU', {maximumFractionDigits: 2})} руб.<br>` +
                           `💰 Твои вложения: ${invested.toLocaleString('ru-RU', {maximumFractionDigits: 2})} руб.<br>` +
                           `📈 Из них проценты: ${(total - invested).toLocaleString('ru-RU', {maximumFractionDigits: 2})} руб.`;
    }

    // Добавление долга в массив
    function addDebt() {
        const name = document.getElementById('debtName').value.trim();
        const balance = parseFloat(document.getElementById('debtBalance').value);
        const min = parseFloat(document.getElementById('debtMin').value);

        if (!name || isNaN(balance) || isNaN(min)) {
            alert("Заполните все поля долга цифрами!"); return;
        }

        globalDebts.push({ name, balance, min_payment: min });

        // Обновляем визуальный список
        const listDiv = document.getElementById('debtsList');
        document.getElementById('addedDebtsBlock').style.display = 'block';
        listDiv.innerHTML += `<div class="debt-item">📌 <b>${name}</b>: ${balance.toLocaleString()} руб. (мин: ${min} руб.)</div>`;

        // Очищаем поля ввода долга
        document.getElementById('debtName').value = '';
        document.getElementById('debtBalance').value = '';
        document.getElementById('debtMin').value = '';
    }

    // Расчет Снежного кома
    function calcSnowball() {
        if (globalDebts.length === 0) { alert("Сначала добавьте хотя бы один долг!"); return; }
        
        const extra = parseFloat(document.getElementById('debtExtra').value) || 0;
        let calcDebts = globalDebts.map(d => ({ ...d }));
        
        // Сортируем от меньшего к большему балансу
        calcDebts.sort((a, b) => a.balance - b.balance);

        let months = 0;
        while (calcDebts.some(d => d.balance > 0) && months < 240) {
            months++;
            let currentExtraPool = extra;

            // Минимальные платежи
            for (let d of calcDebts) {
                if (d.balance > 0) {
                    let actualMin = Math.min(d.min_payment, d.balance);
                    d.balance -= actualMin;
                }
            }

            // Экстра-пул на самый маленький долг
            for (let d of calcDebts) {
                if (d.balance > 0) {
                    let payOff = Math.min(currentExtraPool, d.balance);
                    d.balance -= payOff;
                    currentExtraPool -= payOff;
                    if (currentExtraPool <= 0) break;
                }
            }

            // Фиксируем месяц закрытия
            for (let d of calcDebts) {
                if (d.balance <= 0 && !d.closedIn) d.closedIn = months;
            }
        }

        // Вывод результатов
        const resDiv = document.getElementById('snowballResult');
        resDiv.style.display = 'block';
        let html = `<b>🗓 План погашения долгов:</b><br><br>`;
        calcDebts.forEach((d, i) => {
            html += `${i+1}. <b>${d.name}</b> — закроется через <b>${d.closedIn || 'Много'}</b> мес.<br>`;
        });
        html += `<br>🎉 <b>Полная свобода наступит через: ${months} мес.</b>`;
        resDiv.innerHTML = html;
    }
</script>
</body>
</html>
