<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- ЖЕСТКИЙ ФИКС ДЛЯ IOS: Запрет зума при клике на инпуты -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Финансы iOS</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0; padding: 12px;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }
        .container { max-width: 100%; margin: 0 auto; }
        h2 { text-align: center; color: #2481cc; margin: 10px 0; }

        /* Простые кнопки переключения */
        .tabs { display: table; width: 100%; margin-bottom: 15px; border-collapse: separate; border-spacing: 4px; }
        .tab-btn {
            display: table-cell; text-align: center; padding: 12px 2px; border: none; border-radius: 8px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000000); font-weight: bold; font-size: 13px;
        }
        .tab-btn.active { background-color: #2481cc; color: #ffffff; }

        /* Простое скрытие */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 14px; border-radius: 10px; margin-bottom: 12px;
        }
        label { display: block; margin: 8px 0 4px; font-weight: bold; font-size: 13px; }
        input, select {
            width: 100%; padding: 12px; border: 1px solid #cccccc; border-radius: 8px;
            box-sizing: border-box; background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000); font-size: 16px; /* 16px предотвращает зум на iOS */
        }
        button.calc-btn {
            width: 100%; background-color: #2481cc; color: #ffffff; border: none;
            padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 12px;
        }
        .btn-green { background-color: #4caf50; }
        .result {
            margin-top: 12px; padding: 12px; background: #e1f5fe;
            color: #0288d1; border-radius: 8px; font-size: 14px; line-height: 1.4; display: none;
        }
        .debt-item {
            font-size: 13px; background: var(--tg-theme-bg-color, #ffffff);
            padding: 6px 10px; border-radius: 6px; margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 Фин-Приложение</h2>

    <div class="tabs">
        <div id="btn1" class="tab-btn active" onclick="openTab('tab-compound', 'btn1')">📈 Процент</div>
        <div id="btn2" class="tab-btn" onclick="openTab('tab-debts', 'btn2')">📉 Долги</div>
        <div id="btn3" class="tab-btn" onclick="openTab('tab-safety', 'btn3')">💰 Подушка</div>
    </div>

    <!-- ВКЛАДКА 1 -->
    <div id="tab-compound" class="tab-content active">
        <div class="card">
            <label>Начальная сумма (руб):</label>
            <input type="number" id="principal" value="50000">
            <label>Ежемесячный взнос (руб):</label>
            <input type="number" id="monthly" value="5000">
            <label>Годовой процент (%):</label>
            <input type="number" id="rate" value="16">
            <label>Срок (лет):</label>
            <input type="number" id="years" value="5">
            <button class="calc-btn" onclick="calcCompound()">Рассчитать капитал</button>
            <div id="compoundResult" class="result"></div>
        </div>
    </div>

    <!-- ВКЛАДКА 2 -->
    <div id="tab-debts" class="tab-content">
        <div class="card">
            <label>Название долга:</label>
            <input type="text" id="debtName" placeholder="Например: Кредитка">
            <label>Остаток долга (руб):</label>
            <input type="number" id="debtBalance" placeholder="30000">
            <label>Минимальный платёж (руб):</label>
            <input type="number" id="debtMin" placeholder="2000">
            <button class="calc-btn btn-green" onclick="addDebt()">➕ Добавить долг</button>

            <div id="addedDebtsBlock" style="margin-top: 15px; display: none;">
                <strong>Добавленные долги:</strong>
                <div id="debtsList"></div>
            </div>

            <label style="margin-top: 20px;">Ежемесячный ускоритель (руб):</label>
            <input type="number" id="debtExtra" value="0">

            <button class="calc-btn" onclick="calcSnowball()">🚗 Запустить Снежный ком</button>
            <div id="snowballResult" class="result"></div>
        </div>
    </div>

    <!-- ВКЛАДКА 3 -->
    <div id="tab-safety" class="tab-content">
        <div class="card">
            <label>Твои расходы в месяц (руб):</label>
            <input type="number" id="expenses" value="40000">

            <label>Запас безопасности (срок):</label>
            <select id="safetyPeriod">
                <option value="3">3 месяца (Базовый)</option>
                <option value="6" selected>6 месяцев (Стабильный)</option>
                <option value="12">12 месяцев (Максимальный)</option>
            </select>

            <button class="calc-btn" onclick="calcSafetyNet()">💰 Рассчитать резерв</button>
            <div id="safetyResult" class="result"></div>
        </div>
    </div>
</div>

<script>
    var globalDebts = [];

    // Самый примитивный способ переключения вкладок без использования "event"
    function openTab(tabId, btnId) {
        // Скрываем все вкладки
        document.getElementById('tab-compound').className = 'tab-content';
        document.getElementById('tab-debts').className = 'tab-content';
        document.getElementById('tab-safety').className = 'tab-content';

        // Убираем активность со всех кнопок
        document.getElementById('btn1').className = 'tab-btn';
        document.getElementById('btn2').className = 'tab-btn';
        document.getElementById('btn3').className = 'tab-btn';

        // Активируем нужную вкладку и кнопку
        document.getElementById(tabId).className = 'tab-content active';
        document.getElementById(btnId).className = 'tab-btn active';

        // Скрываем клавиатуру iPhone при переключении табов
        document.activeElement.blur();
    }

    function calcCompound() {
        var p = parseFloat(document.getElementById('principal').value) || 0;
        var m = parseFloat(document.getElementById('monthly').value) || 0;
        var r = (parseFloat(document.getElementById('rate').value) || 0) / 100 / 12;
        var years = parseInt(document.getElementById('years').value) || 0;
        var months = years * 12;

        var total = p;
        var invested = p;
        for (var i = 0; i < months; i++) {
            total = total * (1 + r) + m;
            invested += m;
        }

        var resDiv = document.getElementById('compoundResult');
        resDiv.style.display = 'block';
        resDiv.innerHTML = '🏆 <b>Итоговый капитал:</b> ' + Math.round(total) + ' руб.<br>' +
                           '💰 Твои вложения: ' + Math.round(invested) + ' руб.<br>' +
                           '📈 Из них проценты: ' + Math.round(total - invested) + ' руб.';
    }

    function addDebt() {
        var name = document.getElementById('debtName').value.trim();
        var balance = parseFloat(document.getElementById('debtBalance').value);
        var min = parseFloat(document.getElementById('debtMin').value);

        if (!name || isNaN(balance) || isNaN(min)) {
            alert("Заполните все поля долга!"); return;
        }

        globalDebts.push({ name: name, balance: balance, min_payment: min });

        var listDiv = document.getElementById('debtsList');
        document.getElementById('addedDebtsBlock').style.display = 'block';
        listDiv.innerHTML += '<div class="debt-item">📌 <b>' + name + '</b>: ' + balance + ' руб. (мин: ' + min + ' руб.)</div>';

        document.getElementById('debtName').value = '';
        document.getElementById('debtBalance').value = '';
        document.getElementById('debtMin').value = '';
        document.activeElement.blur();
    }

    function calcSnowball() {
        if (globalDebts.length === 0) { alert("Сначала добавьте долг!"); return; }
        var extra = parseFloat(document.getElementById('debtExtra').value) || 0;

        var calcDebts = [];
        for (var i = 0; i < globalDebts.length; i++) {
            calcDebts.push({
                name: globalDebts[i].name,
                balance: globalDebts[i].balance,
                min_payment: globalDebts[i].min_payment,
                closedIn: 0
            });
        }

        calcDebts.sort(function(a, b) { return a.balance - b.balance; });

        var months = 0;
        var active = true;

        while (active && months < 240) {
            months++;
            var currentExtraPool = extra;
            var anyLeft = false;

            for (var j = 0; j < calcDebts.length; j++) {
                if (calcDebts[j].balance > 0) {
                    var actualMin = Math.min(calcDebts[j].min_payment, calcDebts[j].balance);
                    calcDebts[j].balance -= actualMin;

</body>
</html>
