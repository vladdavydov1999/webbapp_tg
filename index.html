<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Финансовый Аналитик Pro</title>
    <!-- Железобетонное подключение графиков с официального Cloudflare CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f6fa;
            --text-color: #2c3e50;
            --card-bg: #ffffff;
            --accent-color: #2481cc;
            --success-color: #2ecc71;
            --shadow: 0 10px 30px rgba(160, 170, 180, 0.1);
            --border-radius: 20px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121214;
                --text-color: #eceff4;
                --card-bg: #1a1a1e;
                --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            }
            input, select {
                background: #222227 !important;
                color: #eceff4 !important;
                border-color: rgba(255,255,255,0.05) !important;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 20px 16px 40px;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.3s ease;
        }

        .container { max-width: 400px; margin: 0 auto; position: relative; }

        .lang-container { display: flex; justify-content: center; margin-bottom: 24px; }
        .lang-switcher { background: rgba(0, 0, 0, 0.05); padding: 3px; border-radius: 10px; display: inline-flex; gap: 2px; }
        @media (prefers-color-scheme: dark) { .lang-switcher { background: rgba(255, 255, 255, 0.05); } }

        .lang-btn {
            border: none; background: transparent; font-size: 11px; font-weight: 700;
            padding: 6px 16px; border-radius: 8px; cursor: pointer; color: var(--text-color); opacity: 0.4;
            transition: all 0.2s ease;
        }
        .lang-btn.active { background: var(--card-bg); opacity: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        h2 { text-align: center; font-size: 24px; font-weight: 800; margin: 10px 0 24px; letter-spacing: -0.5px; }

        .tabs { display: flex; background: rgba(0, 0, 0, 0.04); padding: 4px; border-radius: 14px; margin-bottom: 24px; }
        @media (prefers-color-scheme: dark) { .tabs { background: rgba(255, 255, 255, 0.04); } }

        .tab-btn {
            flex: 1; text-align: center; padding: 12px 2px; border: none; border-radius: 11px;
            background: transparent; color: var(--text-color); font-weight: 600; font-size: 13px; cursor: pointer; opacity: 0.6;
            transition: all 0.2s ease;
        }
        .tab-btn.active { background-color: var(--card-bg); color: var(--accent-color); opacity: 1; box-shadow: var(--shadow); }

        .tab-content { display: none; }
        .card { background: var(--card-bg); padding: 24px; border-radius: var(--border-radius); margin-bottom: 20px; box-shadow: var(--shadow); }

        label { display: block; margin: 0 0 6px 4px; font-weight: 700; font-size: 13px; opacity: 0.9; }

        input[type="text"], input[type="number"], select {
            width: 100%; padding: 16px; border: 1.5px solid rgba(0,0,0,0.06); border-radius: 14px;
            box-sizing: border-box; background: var(--bg-color); color: var(--text-color); font-size: 16px; font-weight: 600; margin-bottom: 20px; outline: none;
            transition: border 0.2s ease;
        }
        input:focus, select:focus { border-color: var(--accent-color); }

        button.calc-btn {
            width: 100%; background-color: var(--accent-color); color: #ffffff; border: none;
            padding: 18px; border-radius: 14px; font-size: 16px; font-weight: 700; margin-top: 8px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(36, 129, 204, 0.2); transition: all 0.2s ease;
        }
        button.calc-btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn-green { background-color: var(--success-color) !important; box-shadow: 0 4px 12px rgba(46, 204, 113, 0.2) !important; }

        .result {
            margin-top: 24px; padding: 20px; background: rgba(36, 129, 204, 0.04);
            color: var(--text-color); border-radius: 14px; font-size: 14px; line-height: 1.6; border-left: 5px solid var(--accent-color);
            animation: fadeIn 0.3s ease;
        }
        @media (prefers-color-scheme: dark) { .result { background: rgba(36, 129, 204, 0.07); } }

        .debt-item { font-size: 13px; background: rgba(0,0,0,0.02); padding: 12px 16px; border-radius: 12px; margin-top: 10px; border-left: 3px solid var(--success-color); }
        @media (prefers-color-scheme: dark) { .debt-item { background: rgba(255,255,255,0.02); } }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-container">
        <div class="lang-switcher">
            <button id="lang-ru" class="lang-btn active" onclick="setLanguage('ru')">RU</button>
            <button id="lang-en" class="lang-btn" onclick="setLanguage('en')">EN</button>
        </div>
    </div>

    <h2 id="txt-title">📊 Фин-Терминал Pro</h2>

    <div class="tabs">
        <button id="btn1" class="tab-btn active" onclick="openTab('tab-compound', 'btn1')">📈 <span id="tab1-name">Портфель</span>
        </button>
        <button id="btn2" class="tab-btn" onclick="openTab('tab-debts', 'btn2')">📉 <span id="tab2-name">Долги</span>
        </button>
        <button id="btn3" class="tab-btn" onclick="openTab('tab-safety', 'btn3')">💰 <span id="tab3-name">Подушка</span>
        </button>
        <button id="btn4" class="tab-btn" onclick="openTab('tab-realty', 'btn4')">🏠 <span id="tab4-name">Ипотека</span>
        </button>
    </div>

    <!-- ВКЛАДКА 1: ПОРТФЕЛЬ -->
    <div id="tab-compound" class="tab-content" style="display: block;">
        <div class="card">
            <label id="lbl-asset">Выберите базовый актив:</label>
            <select id="assetType" onchange="updateAssetLabels(); calcProAsset();">
                <option value="RUB">🇷🇺 Российский рубль (RUB)</option>
                <option value="BYN">🇧🇾 Белорусский рубль (BYN)</option>
                <option value="USD">🇺🇸 Доллар США (USD)</option>
                <option value="EUR">🇪🇺 Евро (EUR)</option>
                <option value="CNY">🇨🇳 Китайский юань (CNY)</option>
                <option value="XAU" id="opt-gold">XAU Золото (Унция)</option>
                <option value="BRENT" id="opt-oil">OIL Нефть Brent (Баррель)</option>
            </select>

            <label id="lblPrincipal">Стартовый капитал:</label>
            <input type="text" id="principal" value="50 000" oninput="formatInputPrice(this); calcProAsset();">

            <label id="lblMonthly">Регулярное пополнение (в месяц):</label>
            <input type="text" id="monthly" value="5 000" oninput="formatInputPrice(this); calcProAsset();">

            <label id="lbl-rate">Ожидаемый рост актива (% в год):</label>
            <input type="number" id="rate" value="16" oninput="calcProAsset();">

            <label id="lbl-years">Срок удержания позиции (лет):</label>
            <input type="number" id="years" value="5" oninput="calcProAsset();">

            <div style="border-top: 1px solid rgba(0,0,0,0.08); margin-top: 15px; padding-top: 15px;">
                <label id="lbl-inflation">Прогнозная инфляция по активу (% в год):</label>
                <input type="number" id="inflation" value="6" oninput="calcProAsset();">

                <label id="lbl-tax">Налоговая ставка на прибыль (%):</label>
                <select id="taxRate" onchange="calcProAsset();">
                    <option value="0" id="opt-tax0">0% (Льготный период / ИИС)</option>
                    <option value="13" id="opt-tax13" selected>13% (Стандартный налог)</option>
                    <option value="15" id="opt-tax15">15% (Повышенный налог)</option>
                </select>
            </div>
            <div id="assetResult" class="result"></div>
            <!-- <div style="margin-top: 24px; position: relative; width: 100%; height: 220px; display: block;">
                <canvas id="assetChart" style="display: block; width: 100%; height: 100%;"></canvas>
            </div> -->
        </div>
    </div>
</div>

<!-- ВКЛАДКА 2: ДОЛГИ -->
<div id="tab-debts" class="tab-content" style="display: none;">
    <div class="card">
        <label id="lbl-dname">Название обязательства (кредита):</label>
        <input type="text" id="debtName" placeholder="Например: Кредитка">

        <label id="lbl-dbal">Текущий остаток долга:</label>
        <input type="text" id="debtBalance" placeholder="50 000" oninput="formatInputPrice(this);">

        <label id="lbl-drate">Процентная ставка (% в год):</label>
        <input type="number" id="debtRate" value="15">

        <label id="lbl-dmin">Минимальный платёж:</label>
        <input type="text" id="debtMin" placeholder="3 000" oninput="formatInputPrice(this);">

        <button class="calc-btn btn-green" id="btn-adddebt" onclick="addProDebt()">➕ Внести кредит в реестр</button>

        <div id="addedDebtsBlock" style="margin-top: 20px; display: none;">
            <label id="lbl-dregistry">Реестр активных обязательств:</label>
            <div id="debtsList"></div>
        </div>

        <div style="border-top: 1px solid rgba(0,0,0,0.08); margin-top: 20px; padding-top: 15px;">
            <label id="lbl-dextra">Ежемесячный ускоритель досрочного гашения:</label>
            <input type="text" id="debtExtra" value="5 000" oninput="formatInputPrice(this); calcProDebts();">

            <label id="lbl-dstrat">Выберите стратегию оптимизации:</label>
            <select id="debtStrategy" onchange="calcProDebts();">
                <option value="avalanche" id="opt-avalanche" selected>⚡️ Кредитная Лавина (Экономия)</option>
                <option value="snowball" id="opt-snowball">🚗 Снежный ком (Комфорт)</option>
            </select>
        </div>
        <div id="snowballResult" class="result" style="display: none;"></div>
    </div>
</div>
<!-- ВКЛАДКА 3: ПОДУШКА -->
<div id="tab-safety" class="tab-content" style="display: none;">
    <div class="card">
        <label id="lbl-sbase">📊 Бюджет критических трат (в месяц):</label>
        <input type="text" id="expBase" value="30 000" oninput="formatInputPrice(this); calcProSafetyNet();">

        <label id="lbl-scomfort">🚗 Бюджет комфортных трат (в month):</label>
        <input type="text" id="expComfort" value="15 000" oninput="formatInputPrice(this); calcProSafetyNet();">

        <label id="lbl-spremium">🌟 Бюджет избыточных трат (в месяц):</label>
        <input type="text" id="expPremium" value="10 000" oninput="formatInputPrice(this); calcProSafetyNet();">

        <label id="lbl-shorizon">🛡️ Требуемый горизонт безопасности:</label>
        <select id="safetyPeriod" onchange="calcProSafetyNet();">
            <option value="3" id="opt-s3">3 месяца</option>
            <option value="6" id="opt-s6" selected>6 месяцев</option>
            <option value="12" id="opt-s12">12 месяцев</option>
        </select>
        <div id="safetyResult" class="result"></div>
    </div>
</div>

<!-- ВКЛАДКА 4: ИПОТЕКА -->
<div id="tab-realty" class="tab-content" style="display: none;">
    <div class="card">
        <label id="lbl-prop-cost">Стоимость недвижимости (руб):</label>
        <input type="text" id="propCost" value="8 000 000" oninput="formatInputPrice(this); calcRealtyBattle();">

        <label id="lbl-down-pay">Первоначальный взнос (руб):</label>
        <input type="text" id="downPayment" value="2 000 000" oninput="formatInputPrice(this); calcRealtyBattle();">

        <label id="lbl-mort-rate">Ставка по ипотеке (% в год):</label>
        <input type="number" id="mortRate" value="18" oninput="calcRealtyBattle();">

        <label id="lbl-mort-years">Срок кредита (лет):</label>
        <input type="number" id="mortYears" value="20" oninput="calcRealtyBattle();">

        <div style="border-top: 1px solid rgba(0,0,0,0.08); margin-top: 15px; padding-top: 15px;">
            <label id="lbl-rent-cost">Стоимость аренды в месяц (руб):</label>
            <input type="text" id="rentCost" value="35 000" oninput="formatInputPrice(this); calcRealtyBattle();">

            <label id="lbl-rent-inf">Ежегодный рост аренды (инфляция %):</label>
            <input type="number" id="rentInflation" value="6" oninput="calcRealtyBattle();">

            <label id="lbl-inv-yield">Доходность инвестиций (% в год):</label>
            <input type="number" id="invYield" value="16" oninput="calcRealtyBattle();">
        </div>
        <div id="realtyResult" class="result"></div>
    </div>
</div>
</div> <!-- Закрываем общий контейнер .container -->
<script>
    var globalDebts = [];
    var currentLang = 'ru';
    var myAssetChart = null;

    var dictionary = {
        ru: {
            title: "📊 Фин-Терминал Pro", tab1: "Портфель", tab2: "Долги", tab3: "Подушка", tab4: "Ипотека",
            asset: "Выберите базовый актив:", rate: "Ожидаемый рост актива (% в год):",
            years: "Срок удержания позиции (лет):", inflation: "Прогнозная инфляция по активу (% в год):",
            tax: "Налоговая ставка на прибыль (%):", tax0: "0% (Льготный период / ИИС)", tax13: "13% (Стандартный налог)", tax15: "15% (Повышенный налог)",
            dname: "Название обязательства (кредита):", dbal: "Текущий остаток долга:", drate: "Процентная ставка (% в год):",
            dmin: "Минимальный платёж:", adddebt: "➕ Внести кредит в реестр", dregistry: "Реестр активных обязательств:",
            dextra: "Ежемесячный ускоритель досрочного гашения:", dstrat: "Выберите стратегию оптимизации:",
            avalanche: "⚡️ Кредитная Лавина (Экономия)", snowball: "🚗 Снежный ком (Комфорт)",
            sbase: "📊 Бюджет критических трат (в месяц):", scomfort: "🚗 Бюджет комфортных трат (в месяц):",
            spremium: "🌟 Бюджет избыточных трат (в месяц):", shorizon: "🛡️ Требуемый горизонт безопасности:",
            s3: "3 месяца", s6: "6 месяцев", s12: "12 месяцев", gold: "XAU Золото (Унция)", oil: "OIL Нефть Brent (Баррель)",
            prop_cost: "Стоимость недвижимости (руб):", down_pay: "Первоначальный взнос (руб):", mort_rate: "Ставка по ипотеке (% в год):",
            mort_years: "Срок кредита (лет):", rent_cost: "Стоимость аренды в месяц (руб):", rent_inf: "Ежегодный рост аренды (инфляция %):", inv_yield: "Доходность инвестиций (% в год):"
        },
        en: {
            title: "📊 Fin-Terminal Pro", tab1: "Portfolio", tab2: "Debts", tab3: "Safety Net", tab4: "Mortgage",
            asset: "Select base asset:", rate: "Expected asset growth (% per year):",
            years: "Holding period (years):", inflation: "Expected inflation (% per year):",
            tax: "Tax rate on profit (%):", tax0: "0% (Tax-free / ISA)", tax13: "13% (Standard Tax)", tax15: "15% (High Income Tax)",
            dname: "Debt title (credit):", dbal: "Current outstanding balance:", drate: "Interest rate (% per year):",
            dmin: "Minimum monthly payment:", adddebt: "➕ Add Credit to Registry", dregistry: "Active Debt Registry:",
            dextra: "Monthly extra payoff accelerator:", dstrat: "Select optimization strategy:",
            avalanche: "⚡️ Debt Avalanche (Save %)", snowball: "🚗 Debt Snowball (Comfort)",
            sbase: "📊 Critical expenses budget (monthly):", scomfort: "🚗 Comfort expenses budget (monthly):",
            spremium: "🌟 Premium expenses budget (monthly):", shorizon: "🛡️ Required safety horizon:",
            s3: "3 months", s6: "6 months", s12: "12 months", gold: "XAU Gold (Ounce)", oil: "OIL Brent Crude (Barrel)",
            prop_cost: "Property Value (rub):", down_pay: "Down Payment (rub):", mort_rate: "Mortgage Interest Rate (% per year):",
            mort_years: "Loan Term (years):", rent_cost: "Monthly Rent Cost (rub):", rent_inf: "Annual Rent Growth (inflation %):", inv_yield: "Investment Portfolio Yield (% per year):"
        }
    };

    function formatInputPrice(input) {
        var value = input.value.replace(/\s+/g, '').replace(/\D/g, '');
        if (value) { input.value = parseFloat(value).toLocaleString('ru-RU'); }
        else { input.value = ''; }
    }

    function setLanguage(lang) {
        currentLang = lang;
        document.getElementById('lang-ru').className = lang === 'ru' ? 'lang-btn active' : 'lang-btn';
        document.getElementById('lang-en').className = lang === 'en' ? 'lang-btn active' : 'lang-btn';

        var d = dictionary[lang];
        document.getElementById('txt-title').innerText = d.title;
        document.getElementById('tab1-name').innerText = d.tab1;
        document.getElementById('tab2-name').innerText = d.tab2;
        document.getElementById('tab3-name').innerText = d.tab3;
        document.getElementById('tab4-name').innerText = d.tab4;

        document.getElementById('lbl-asset').innerText = d.asset;
        document.getElementById('lbl-rate').innerText = d.rate;
        document.getElementById('lbl-years').innerText = d.years;
        document.getElementById('lbl-inflation').innerText = d.inflation;
        document.getElementById('lbl-tax').innerText = d.tax;
        document.getElementById('opt-tax0').innerText = d.tax0;
        document.getElementById('opt-tax13').innerText = d.tax13;
        document.getElementById('opt-tax15').innerText = d.tax15;
        document.getElementById('opt-gold').innerText = d.gold;
        document.getElementById('opt-oil').innerText = d.oil;

        document.getElementById('lbl-dname').innerText = d.dname;
        document.getElementById('lbl-dbal').innerText = d.dbal;
        document.getElementById('lbl-drate').innerText = d.drate;
        document.getElementById('lbl-dmin').innerText = d.dmin;
        document.getElementById('btn-adddebt').innerText = d.adddebt;
        document.getElementById('lbl-dregistry').innerText = d.dregistry;
        document.getElementById('lbl-dextra').innerText = d.dextra;
        document.getElementById('lbl-dstrat').innerText = d.dstrat;
        document.getElementById('opt-avalanche').innerText = d.avalanche;
        document.getElementById('opt-snowball').innerText = d.snowball;

        document.getElementById('lbl-sbase').innerText = d.sbase;
        document.getElementById('lbl-scomfort').innerText = d.scomfort;
        document.getElementById('lbl-spremium').innerText = d.spremium;
        document.getElementById('lbl-shorizon').innerText = d.shorizon;
        document.getElementById('opt-s3').innerText = d.s3;
        document.getElementById('opt-s6').innerText = d.s6;
        document.getElementById('opt-s12').innerText = d.s12;

        document.getElementById('lbl-prop-cost').innerText = d.prop_cost;
        document.getElementById('lbl-down-pay').innerText = d.down_pay;
        document.getElementById('lbl-mort-rate').innerText = d.mort_rate;
        document.getElementById('lbl-mort-years').innerText = d.mort_years;
        document.getElementById('lbl-rent-cost').innerText = d.rent_cost;
        document.getElementById('lbl-rent-inf').innerText = d.rent_inf;
        document.getElementById('lbl-inv-yield').innerText = d.inv_yield;

        updateAssetLabels();
        calcProAsset();
        calcProDebts();
        calcProSafetyNet();
        calcRealtyBattle();
    }

    function openTab(tabId, btnId) {
        document.getElementById('tab-compound').style.display = 'none';
        document.getElementById('tab-debts').style.display = 'none';
        document.getElementById('tab-safety').style.display = 'none';
        document.getElementById('tab-realty').style.display = 'none';
        document.getElementById(tabId).style.display = 'block';

        document.getElementById('btn1').className = 'tab-btn';
        document.getElementById('btn2').className = 'tab-btn';
        document.getElementById('btn3').className = 'tab-btn';
        document.getElementById('btn4').className = 'tab-btn';
        document.getElementById(btnId).className = 'tab-btn active';
    }

    function updateAssetLabels() {
        var asset = document.getElementById('assetType').value;
        var p = document.getElementById('lblPrincipal');
        var m = document.getElementById('lblMonthly');
        var inf = document.getElementById('inflation');

        if (currentLang === 'ru') {
            if (asset === "XAU") { p.innerText = "Стартовый объем (Унции):"; m.innerText = "Ежемесячная закупка (Унций):"; inf.value = "2"; }
            else if (asset === "BRENT") { p.innerText = "Стартовый объем (Баррели):"; m.innerText = "Ежемесячная закупка (Баррелей):"; inf.value = "3"; }
            else { p.innerText = "Стартовый капитал (" + asset + "):"; m.innerText = "Ежемесячное пополнение (" + asset + "):"; inf.value = (asset==="USD"||asset==="EUR") ? "3" : "6"; }
        } else {
            if (asset === "XAU") { p.innerText = "Starting Volume (Ounces):"; m.innerText = "Monthly Purchase (Ounces):"; inf.value = "2"; }
            else if (asset === "BRENT") { p.innerText = "Starting Volume (Barrels):"; m.innerText = "Monthly Purchase (Barrels):"; inf.value = "3"; }
            else { p.innerText = "Starting Capital (" + asset + "):"; m.innerText = "Monthly Deposit (" + asset + "):"; inf.value = (asset==="USD"||asset==="EUR") ? "3" : "6"; }
        }
    }
    function calcProAsset() {
        var asset = document.getElementById('assetType').value;
        var p = parseFloat(document.getElementById('principal').value.replace(/\s+/g, '')) || 0;
        var m = parseFloat(document.getElementById('monthly').value.replace(/\s+/g, '')) || 0;
        var nominalRate = (parseFloat(document.getElementById('rate').value) || 0) / 100;
        var years = parseInt(document.getElementById('years').value) || 0;
        var inflationRate = (parseFloat(document.getElementById('inflation').value) || 0) / 100;
        var taxRate = (parseFloat(document.getElementById('taxRate').value) || 0) / 100;
        var months = years * 12;

        var realRateMonthly = ((1 + nominalRate) / (1 + inflationRate) - 1) / 12;
        var nominalRateMonthly = nominalRate / 12;
        var nominalTotal = p, realTotal = p, totalInvested = p;

        var chartLabels = [];
        var chartNominalData = [p];
        var chartRealData = [p];

        for (var i = 1; i <= months; i++) {
            nominalTotal = nominalTotal * (1 + nominalRateMonthly) + m;
            realTotal = realTotal * (1 + realRateMonthly) + m;
            totalInvested += m;

            if (i % 12 === 0) {
                chartLabels.push(i / 12);
                chartNominalData.push(Math.round(nominalTotal));
                chartRealData.push(Math.round(realTotal));
            }
        }

        var profit = nominalTotal - totalInvested;
        var taxValue = profit > 0 ? profit * taxRate : 0;
        var totalAfterTax = nominalTotal - taxValue;
        var sign = asset === "XAU" ? (currentLang==='ru'?"унций":"oz") : (asset === "BRENT" ? (currentLang==='ru'?"барр.":"bbl") : asset);

        var resDiv = document.getElementById('assetResult');
        resDiv.style.display = 'block';

        if (currentLang === 'ru') {
            resDiv.innerHTML = '📊 <b>Номинальный объем позиции:</b><br>• Итого на балансе: <b>' + Math.round(nominalTotal).toLocaleString() + ' ' + sign + '</b><br>• Налог на прирост: <span style="color: #e74c3c;">-' + Math.round(taxValue).toLocaleString() + '</span><br>• Чистый баланс: <b>' + Math.round(totalAfterTax).toLocaleString() + ' ' + sign + '</b><br><br>📉 <b>Реальная ценность (с учетом инфляции):</b><br>• С учетом инфляции: <span style="color: #2ecc71; font-weight: bold;">' + Math.round(realTotal).toLocaleString() + ' ' + sign + '</b><br><br>📥 Ваши личные вложения: ' + Math.round(totalInvested).toLocaleString();
        } else {
            resDiv.innerHTML = '📊 <b>Nominal Position Volume:</b><br>• Total Balance: <b>' + Math.round(nominalTotal).toLocaleString() + ' ' + sign + '</b><br>• Capital Gains Tax: <span style="color: #e74c3c;">-' + Math.round(taxValue).toLocaleString() + '</span><br>• Net Balance: <b>' + Math.round(totalAfterTax).toLocaleString() + ' ' + sign + '</b><br><br>📉 <b>Real Value (Inflation Adjusted):</b><br>• Real Value: <span style="color: #2ecc71; font-weight: bold;">' + Math.round(realTotal).toLocaleString() + ' ' + sign + '</b><br><br>📥 Total Invested by You: ' + Math.round(totalInvested).toLocaleString();
        }

        var canvasEl = document.getElementById('assetChart');
        if (!canvasEl) return;
        var ctx = canvasEl.getContext('2d');

        if (myAssetChart) { myAssetChart.destroy(); }

        var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var gridColor = isDark ? 'rgba(255, 255, 255, 0.06)' : 'rgba(0, 0, 0, 0.04)';
        var textColor = isDark ? '#eceff4' : '#2c3e50';

        myAssetChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: chartLabels,
                datasets: [
                    {
                        label: currentLang === 'ru' ? 'Номинал' : 'Nominal',
                        data: chartNominalData,
                        borderColor: '#2481cc',
                        backgroundColor: 'rgba(36, 129, 204, 0.1)',
                        borderWidth: 3,
                        pointRadius: 2,
                        tension: 0.3,
                        fill: true
                    },
                    {
                        label: currentLang === 'ru' ? 'С учетом инфляции' : 'Inflation Adjusted',
                        data: chartRealData,
                        borderColor: '#2ecc71',
                        backgroundColor: 'rgba(46, 204, 113, 0.05)',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.3
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: textColor, font: { weight: '600', size: 11 } } }
                },
                scales: {
                    x: {
                        grid: { color: gridColor },
                        ticks: { color: textColor, font: { size: 10 } },
                        title: { display: true, text: currentLang === 'ru' ? 'Лет' : 'Years', color: textColor, font: { weight: '600' } }
                    },
                    y: {
                        grid: { color: gridColor },
                        ticks: { color: textColor, font: { size: 10 }, callback: function(value) { return value.toLocaleString(); } }
                    }
                }
            }
        });
    }

    function addProDebt() {
        var name = document.getElementById('debtName').value.trim();
        var balance = parseFloat(document.getElementById('debtBalance').value.replace(/\s+/g, ''));
        var rate = parseFloat(document.getElementById('debtRate').value);
        var min = parseFloat(document.getElementById('debtMin').value.replace(/\s+/g, ''));
        if (!name || isNaN(balance) || isNaN(rate) || isNaN(min)) { return; }

        globalDebts.push({ name: name, balance: balance, rate: rate, min_payment: min });
        var listDiv = document.getElementById('debtsList');
        document.getElementById('addedDebtsBlock').style.display = 'block';
        listDiv.innerHTML += '<div class="debt-item">📌 <b>' + name + '</b>: ' + balance.toLocaleString('ru-RU') + ' (Rate: ' + rate + '%, Min: ' + min.toLocaleString('ru-RU') + ')</div>';
        document.getElementById('debtName').value = ''; document.getElementById('debtBalance').value = ''; document.getElementById('debtMin').value = '';
        calcProDebts();
    }

    function calcProDebts() {
        if (globalDebts.length === 0) { return; }
        var extra = parseFloat(document.getElementById('debtExtra').value.replace(/\s+/g, '')) || 0;
        var strategy = document.getElementById('debtStrategy').value;
        var calcDebts = globalDebts.map(function(d) { return { name: d.name, balance: d.balance, rate: d.rate, min_payment: d.min_payment, closedIn: 0 }; });

        var months = 0, totalInterestsPaid = 0, active = true;
        while (active && months < 240) {
            months++; var currentExtraPool = extra, anyLeft = false;
            for (var i = 0; i < calcDebts.length; i++) {
                if (calcDebts[i].balance > 0) {
                    var monthlyInterest = calcDebts[i].balance * ((calcDebts[i].rate / 100) / 12);
                    calcDebts[i].balance += monthlyInterest; totalInterestsPaid += monthlyInterest;
                }
            }
            for (var j = 0; j < calcDebts.length; j++) {
                if (calcDebts[j].balance > 0) {
                    var actualMin = Math.min(calcDebts[j].min_payment, calcDebts[j].balance);
                    calcDebts[j].balance -= actualMin;
                    if (actualMin > calcDebts[j].balance && calcDebts[j].balance === 0) { currentExtraPool += (actualMin - calcDebts[j].balance); }
                }
            }
            if (strategy === "avalanche") { calcDebts.sort(function(a, b) { return b.rate - a.rate; }); }
            else { calcDebts.sort(function(a, b) { return a.balance - b.balance; }); }
            for (var k = 0; k < calcDebts.length; k++) {
                if (calcDebts[k].balance > 0) {
                    var payOff = Math.min(currentExtraPool, calcDebts[k].balance);
                    calcDebts[k].balance -= payOff; currentExtraPool -= payOff;
                    if (currentExtraPool <= 0) break;
                }
            }
            for (var m = 0; m < calcDebts.length; m++) {
                if (calcDebts[m].balance <= 0 && calcDebts[m].closedIn === 0) { calcDebts[m].closedIn = months; }
                if (calcDebts[m].balance > 0) { anyLeft = true; }
            }
            if (!anyLeft) { active = false; }
        }

        var resDiv = document.getElementById('snowballResult'); resDiv.style.display = 'block';
        if (currentLang === 'ru') {
            var html = '<b>📊 Анализ кредитной нагрузки:</b><br><br>';
            for (var n = 0; n < calcDebts.length; n++) { html += (n+1) + '. <b>' + calcDebts[n].name + '</b> — через: <b>' + calcDebts[n].closedIn + '</b> мес.<br>'; }
            html += '<br>🚨 Потери на процентах: <span style="color: #e74c3c;">' + Math.round(totalInterestsPaid).toLocaleString('ru-RU') + ' руб.</span><br>🎉 Полная свобода через: <b>' + months + ' мес.</b>';
            resDiv.innerHTML = html;
        } else {
            var html = '<b>📊 Debt Load Analysis:</b><br><br>';
            for (var n = 0; n < calcDebts.length; n++) { html += (n+1) + '. <b>' + calcDebts[n].name + '</b> — cleared in: <b>' + calcDebts[n].closedIn + '</b> months.<br>'; }
            html += '<br>🚨 Total Interest Loss: <span style="color: #e74c3c;">' + Math.round(totalInterestsPaid).toLocaleString('ru-RU') + '</span><br>🎉 Debt Free in: <b>' + months + ' months</b>';
            resDiv.innerHTML = html;
        }
    }

    function calcProSafetyNet() {
        var base = parseFloat(document.getElementById('expBase').value.replace(/\s+/g, '')) || 0;
        var comfort = parseFloat(document.getElementById('expComfort').value.replace(/\s+/g, '')) || 0;
        var premium = parseFloat(document.getElementById('expPremium').value.replace(/\s+/g, '')) || 0;
        var period = parseInt(document.getElementById('safetyPeriod').value) || 6;

        var totalComfortStyle = (base + comfort + premium) * period;
        var survivalMonthly = base + (comfort * 0.5);
        var totalSurvivalStyle = survivalMonthly * period;

        var resDiv = document.getElementById('safetyResult');
        if (resDiv) resDiv.style.display = 'block';

        if (currentLang === 'ru') {
            resDiv.innerHTML = '🛡️ <b>Моделирование Резервного Фонда:</b><br><br>🟢 <b>Сценарий «Комфорт»:</b> <b>' + Math.round(totalComfortStyle).toLocaleString('ru-RU') + ' руб.</b><br>⚠️ <b>Сценарий «Выживание»:</b> <b>' + Math.round(totalSurvivalStyle).toLocaleString('ru-RU') + ' руб.</b><br><br>🏛 <b>Ликвидность резерва (20%/50%/30%):</b><br>• Кеш: ' + Math.round(totalComfortStyle*0.2).toLocaleString('ru-RU') + ' руб.<br>• Вклад: ' + Math.round(totalComfortStyle*0.5).toLocaleString('ru-RU') + ' руб.<br>• ОФЗ: ' + Math.round(totalComfortStyle*0.3).toLocaleString('ru-RU') + ' руб.';
        } else {
            resDiv.innerHTML = '🛡️ <b>Emergency Fund Modeling:</b><br><br>🟢 <b>Comfort Scenario:</b> <b>' + Math.round(totalComfortStyle).toLocaleString('ru-RU') + '</b><br>⚠️ <b>Survival Scenario:</b> <b>' + Math.round(totalSurvivalStyle).toLocaleString('ru-RU') + '</b><br><br>🏛 <b>Liquidity Distribution (20%/50%/30%):</b><br>• Cash: ' + Math.round(totalComfortStyle*0.2).toLocaleString('ru-RU') + '<br>• Bank: ' + Math.round(totalComfortStyle*0.5).toLocaleString('ru-RU') + '<br>• Bonds: ' + Math.round(totalComfortStyle*0.3).toLocaleString('ru-RU');
        }
    }

    function calcRealtyBattle() {
        var costRaw = document.getElementById('propCost').value.replace(/\s+/g, '');
        var downPayRaw = document.getElementById('downPayment').value.replace(/\s+/g, '');
        var rentRaw = document.getElementById('rentCost').value.replace(/\s+/g, '');

        var cost = parseFloat(costRaw) || 0;
        var downPay = parseFloat(downPayRaw) || 0;
        var rent = parseFloat(rentRaw) || 0;

        var mortRate = (parseFloat(document.getElementById('mortRate').value) || 0) / 100;
        var years = parseInt(document.getElementById('mortYears').value) || 0;
        var rentInf = (parseFloat(document.getElementById('rentInflation').value) || 0) / 100;
        var invYield = (parseFloat(document.getElementById('invYield').value) || 0) / 100;

        var months = years * 12;
        var loanAmount = cost - downPay;

        var monthlyRate = mortRate / 12;
        var mortgagePayment = 0;
        if (loanAmount > 0 && monthlyRate > 0) {
            mortgagePayment = loanAmount * (monthlyRate * Math.pow(1 + monthlyRate, months)) / (Math.pow(1 + monthlyRate, months) - 1);
        }

        var totalMortgagePaid = mortgagePayment * months;
        var interestOverpayment = totalMortgagePaid - loanAmount;

        var portfolio = downPay;
        var currentRent = rent;
        var totalRentPaid = 0;

        for (var m = 1; m <= months; m++) {
            if (m % 12 === 0) { currentRent = currentRent * (1 + rentInf); }
            totalRentPaid += currentRent;
            var savings = mortgagePayment - currentRent;
            portfolio = portfolio * (1 + (invYield / 12));
            if (savings > 0) { portfolio += savings; }
        }

        var resDiv = document.getElementById('realtyResult');
        if (resDiv) resDiv.style.display = 'block';

        if (currentLang === 'ru') {
            var verdict = portfolio > cost ?
                '<span style="color: #2ecc71; font-weight: bold;">🏢 Стратегия Аренды выгоднее!</span> Накопленный капитал превышает стоимость квартиры.' :
                '<span style="color: #2481cc; font-weight: bold;">🏠 Стратегия Ипотеки выгоднее!</span> Своя недвижимость защитила капитал лучше рынка.';

            if (resDiv) {
                resDiv.innerHTML =
                    '<b>🏦 Сценарий «Ипотека» за ' + years + ' лет:</b><br>' +
                    '• Ежемесячный платеж банкирам: <b>' + Math.round(mortgagePayment).toLocaleString('ru-RU') + ' руб.</b><br>' +
                    '• Всего выплатите банку: ' + Math.round(totalMortgagePaid).toLocaleString('ru-RU') + ' руб.<br>' +
                    '• Из них чистая переплата по %: <span style="color: #e74c3c;">' + Math.round(interestOverpayment).toLocaleString('ru-RU') + ' руб.</span><br><br>' +
                    '<b>📈 Сценарий «Аренда и Инвестиции»:</b><br>' +
                    '• Капитал в акциях/золоте/ОФЗ: <b>' + Math.round(portfolio).toLocaleString('ru-RU') + ' руб.</b><br>' +
                    '• Суммарно отдадите за аренду: ' + Math.round(totalRentPaid).toLocaleString('ru-RU') + ' руб.<br><br>' +
                    '🏁 <b>Вердикт финансиста:</b><br>' + verdict;
            }
        } else {
            var verdict = portfolio > cost ?
                '<span style="color: #2ecc71; font-weight: bold;">🏢 Rent & Invest wins!</span> Your capital grows larger than property value.' :
                '<span style="color: #2481cc; font-weight: bold;">🏠 Mortgage wins!</span> Property equity outperformed the investment strategy.';

            if (resDiv) {
                resDiv.innerHTML =
                    '<b>🏦 Mortgage Scenario (' + years + ' years):</b><br>' +
                    '• Monthly Bank Payment: <b>' + Math.round(mortgagePayment).toLocaleString('ru-RU') + ' rub.</b><br>' +
                    '• Total Paid to Bank: ' + Math.round(totalMortgagePaid).toLocaleString('ru-RU') + ' rub.<br>' +
                    '• Interest Overpayment: <span style="color: #e74c3c;">' + Math.round(interestOverpayment).toLocaleString('ru-RU') + ' rub.</span><br><br>' +
                    '<b>📈 Rent & Invest Scenario:</b><br>' +
                    '• Accumulated Invest Portfolio: <b>' + Math.round(portfolio).toLocaleString('ru-RU') + ' rub.</b><br>' +
                    '• Total Rent Expenses: ' + Math.round(totalMortgagePaid).toLocaleString('ru-RU') + ' rub.<br><br>' +
                    '🏁 <b>Financial Verdict:</b><br>' + verdict;
            }
        }
    }

    updateAssetLabels();
    calcProAsset();
    calcProDebts();
    calcProSafetyNet();
    calcRealtyBattle();
</script>
