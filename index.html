<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- ИСПРАВЛЕНИЕ ДЛЯ IOS: Запрещаем масштабирование при фокусе на инпутах -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Финансовый Ассистент</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            margin: 0; padding: 16px;
            /* ИСПРАВЛЕНИЕ ДЛЯ IOS: предотвращаем сдвиги интерфейса */
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        /* ... Весь остальной твой CSS-стиль без изменений ... */
    </style>
</head>
<body>

<div class="container">
    <h2>📊 Фин-Приложение</h2>

    <!-- Кнопки переключения (Теперь их три!) -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-compound')">📈 Процент</button>
        <button class="tab-btn" onclick="switchTab('tab-debts')">📉 Долги</button>
        <button class="tab-btn" onclick="switchTab('tab-safety')">💰 Подушка</button>
    </div>

    <!-- ВКЛАДКА 1: Сложный процент -->
    <div id="tab-compound" class="tab-content active">
        <div class="card">
            <label>Начальная сумма (руб):</label>
            <input type="number" id="principal" value="50000">
            <label>Ежемесячный взнос (руб):</label>
            <input type="number" id="monthly" value="5000">
            <label>Годовой процент (%):</label>
            <input type="number" id="rate" value="16">
            <label>Срок (лет):</label>
            <input type="number" id="years" value="5">
            <button onclick="calcCompound()">Рассчитать капитал</button>
            <div id="compoundResult" class="result"></div>
        </div>
    </div>

    <!-- ВКЛАДКА 2: Снежный ком -->
    <div id="tab-debts" class="tab-content">
        <div class="card">
            <div id="debtForm">
                <label>Название долга:</label>
                <input type="text" id="debtName" placeholder="Например: Кредитка">
                <label>Остаток долга (руб):</label>
                <input type="number" id="debtBalance" placeholder="30000">
                <label>Минимальный платёж (руб):</label>
                <input type="number" id="debtMin" placeholder="2000">
                <button class="btn-secondary" onclick="addDebt()">➕ Добавить долг</button>
            </div>

            <div id="addedDebtsBlock" style="margin-top: 15px; display: none;">
                <strong>Добавленные долги:</strong>
                <div id="debtsList"></div>
            </div>

            <label style="margin-top: 20px;">Ежемесячный ускоритель (руб):</label>
            <input type="number" id="debtExtra" value="0">

            <button onclick="calcSnowball()">🚗 Запустить Снежный ком</button>
            <div id="snowballResult" class="result"></div>
        </div>
    </div>

    <!-- ВКЛАДКА 3: Финансовая подушка -->
    <div id="tab-safety" class="tab-content">
        <div class="card">
            <label>Твои расходы в месяц (руб):</label>
            <input type="number" id="expenses" value="40000" placeholder="Еда, аренда, платежи...">

            <label>Запас безопасности (срок):</label>
            <select id="safetyPeriod">
                <option value="3">3 месяца (Базовый)</option>
                <option value="6" selected>6 месяцев (Стабильный)</option>
                <option value="12">12 месяцев (Максимальный)</option>
            </select>

            <button onclick="calcSafetyNet()">💰 Рассчитать резерв</button>
            <div id="safetyResult" class="result"></div>
        </div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    // ИСПРАВЛЕНИЕ ДЛЯ IOS: Принудительное расширение окна
    setTimeout(() => {
        tg.expand();
    }, 200);

    // ИСПРАВЛЕНИЕ ДЛЯ IOS: Лечим залипание клавиатуры и потерю фокуса
    document.addEventListener('click', event => {
        const focusedElement = document.activeElement;
        if (focusedElement && focusedElement !== event.target && ['INPUT', 'SELECT'].includes(focusedElement.tagName)) {
            focusedElement.blur();
        }
    });

    // ... Твои JS функции calcCompound(), addDebt(), calcSnowball(), calcSafetyNet() ...
</script>
</body>
</html>
